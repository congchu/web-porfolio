<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bgGrad)" stroke="url(#cyberGrad)" stroke-width="5" />

  <!-- Inner Ambient Aura -->
  <circle cx="64" cy="64" r="38" fill="url(#cyberGrad)" opacity="0.18" filter="url(#glow)" />

  <!-- Code Monogram: <NC /> -->
  <!-- Left angle bracket < -->
  <path d="M 38 46 L 24 64 L 38 82" fill="none" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Monogram NC -->
  <!-- N -->
  <path d="M 46 80 L 46 48 L 62 80 L 62 48" fill="none" stroke="#f8fafc" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- C -->
  <path d="M 82 52 C 77 46, 68 46, 66 58 C 64 70, 75 78, 82 74" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" />

  <!-- Closing slash / -->
  <line x1="90" y1="78" x2="98" y2="50" stroke="#8b5cf6" stroke-width="6" stroke-linecap="round" />

  <!-- Right angle bracket > -->
  <path d="M 102 46 L 114 64 L 102 82" fill="none" stroke="#a855f7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
